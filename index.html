<body>
    <h1>Electricity Consumption Classifier</h1>
    <!--Energy Uses-->
    <input type="text" id="Consumption" class="form-control" placeholder="typer here..."

    <button class="btn btn-info" onclick="checkConsumption()"></button>
    <button class="btn btn-info" onclick="checkConsumption()">Check</button>

    <script>
        function checkConsumption(){
            var consumption = document.getElementById("Consumption").value;

            if(isNaN(consumption) || consumption < 0){
                alert("Please input valid kwh imnida.")
            }

        else if(consumption >= 100 && consumption <=200){
          alert("Normal residential rate.");
        }
        else if(consumption >= 201 && consumption <=300){
            alert("Typical electicity usage.");
        }
        else if(consumption >= 301 && consumption <=400){
            alert("High electricity usage.");
        }
        else if(consumption >= 401 && consumption <=500){
            alert("Heavy electricity user.");
        }
        else{
            alert("Please type your kwh imnida.");
        }
        }    
    </script>
</body>
</html>
