<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q4Drill1</title>
    <style>
        body{
            background-image: url(https://i.pinimg.com/originals/8e/55/40/8e55405f83edb57e51ffe4bb190d29e0.gif);
            background-size: 1300px;
        }
        h1{
            font-family: 'Courier New', Courier, monospace;
            color: rgb(132, 249, 245);
            text-align: center;
        }
        .btn-custom{
            font-family: 'Courier New', Courier, monospace;
            border: 3px dotted white;
            border-radius: 20px;
            background-color: rgb(176, 251, 254);
            text-align: center;
            
        }
        input{
            text-align: center;
        }
        

    </style>
</head>
<body>
    <h1>Electricity Consumption Classifier</h1>
    <!--Energy Uses-->
    <input type="text" id="Consumption" class="form-control" placeholder="typer here..."

    <button class="btn btn-custom" onclick="checkConsumption()"></button>
    <button class="btn btn-custom" onclick="checkConsumption()">Check</button>

    <script>
        function checkConsumption(){
            var consumption = document.getElementById("Consumption").value;

            if(isNaN(consumption) || consumption < 0){
                alert("Please input valid kwh imnida.")
            }

        else if(consumption >= 100 && consumption <=200){
          alert("Normal residential rate.");
        }
        else if(consumption >= 201 && consumption <=300){
            alert("Typical electicity usage.");
        }
        else if(consumption >= 301 && consumption <=400){
            alert("High electricity usage.");
        }
        else if(consumption >= 401 && consumption <=500){
            alert("Heavy electricity user.");
        }
        else{
            alert("Please type your kwh imnida.");
        }
        }    
    </script>
</body>
</html>
